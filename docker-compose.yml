services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crmbelow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crmbelow"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/crmbelow
      JWT_SECRET: desarrollo-cambiar-en-produccion
      STORAGE_PATH: /app/storage
    volumes:
      - document_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  document_storage:
